<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket 客户端</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #203134; background: #f3f6f6; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(16px, 5vw, 52px); display: flex; justify-content: center; }
    main, .panel, label, #log { display: flex; flex-direction: column; }
    main { width: min(100%, 680px); gap: 18px; }
    header, .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    header { justify-content: space-between; }
    h1 { margin: 0; font-size: clamp(23px, 4vw, 31px); }
    #status { color: #486365; }
    .panel { margin: 0; gap: 14px; padding: 18px; border: 1px solid #cbd6d6; border-radius: 10px; background: white; min-width: 0; }
    .row { align-items: flex-end; }
    label { flex: 1 1 160px; gap: 5px; font-size: 14px; font-weight: 600; }
    input, textarea, button { font: inherit; border: 1px solid #a4b5b5; border-radius: 6px; padding: 8px 10px; }
    input, textarea { min-width: 0; color: inherit; background: white; }
    textarea { resize: vertical; }
    button { background: white; color: #1b5052; cursor: pointer; }
    .primary { color: white; background: #145e60; border-color: #145e60; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid #177b83; outline-offset: 2px; }
    #log { gap: 6px; min-height: 6rem; max-height: 16rem; overflow: auto; font: 14px/1.5 ui-monospace, monospace; }
    #log span { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
  <script src="./client.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1><span>WebSocket 客户端</span></h1>
      <span id="status" role="status">未连接</span>
    </header>

    <form id="connection" class="panel" aria-label="连接">
      <div class="row">
        <label><span>用户 ID</span><input id="user" value="alice" maxlength="128" required></label>
        <button id="connect" class="primary" type="submit"><span>连接</span></button>
        <button id="disconnect" type="button" disabled><span>断开</span></button>
      </div>
    </form>

    <fieldset id="actions" class="panel" aria-label="聊天" disabled>
      <div class="row">
        <label><span>频道</span>
          <input id="channel" value="workshop">
        </label>
        <button id="join" type="button"><span>加入频道</span></button>
        <button id="leave" type="button"><span>退出频道</span></button>
      </div>
      <label><span>私聊收件人</span><input id="recipient" value="bob" maxlength="128"></label>
      <label><span>消息内容</span><textarea id="text" rows="2"></textarea></label>
      <div class="row">
        <button id="direct" class="primary" type="button"><span>发送私聊</span></button>
        <button id="broadcast" type="button"><span>发送到频道</span></button>
      </div>
    </fieldset>

    <section class="panel" aria-labelledby="log-title">
      <strong id="log-title"><span>消息记录</span></strong>
      <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
    </section>
  </main>
</body>
</html>
